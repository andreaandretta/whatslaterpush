name: Build Evolution Patched

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Suffisso tag (tag finale: v2.3.7-<suffix>)'
        required: true
        default: 'p1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./deploy/evolution-patched
          platforms: linux/amd64
          push: true
          tags: whatslater/evo-patched:v2.3.7-${{ inputs.tag_suffix }}
